name: Host Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  host-regression:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain versions
        shell: pwsh
        run: |
          gcc --version
          $PSVersionTable.PSVersion

      - name: Build and run host models
        shell: pwsh
        run: ./tests/run_host_tests.ps1
